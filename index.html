<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🎮 Juegos de Carrera</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color: white;
  text-align: center;
  margin: 0;
  padding: 20px;
}

.pantalla { display: none; }
.activa { display: block; }

input, select {
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 10px 16px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  background: #00c9ff;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #92fe9d; }

button:disabled {
  background: gray;
  cursor: not-allowed;
}

#pista {
  width: 90%;
  height: 260px;
  margin: 20px auto;
  border: 3px solid white;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: #111;
}

/* 🔥 Carriles visuales */
#pista::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background:
    linear-gradient(to bottom,
      transparent 24%, white 25%, transparent 26%,
      transparent 49%, white 50%, transparent 51%,
      transparent 74%, white 75%, transparent 76%
    );
  opacity: 0.2;
}

.meta {
  position: absolute;
  right: 0;
  top: 0;
  width: 20px;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    white 0px,
    white 10px,
    black 10px,
    black 20px
  );
}

.personaje {
  position: absolute;
  font-size: 40px;
  transition: left 0.35s linear;
  left: 0;
  transform: translateY(-50%);
}

/* 🔥 CENTRADO PERFECTO */
#c0 { top: 12.5%; }
#c1 { top: 37.5%; }
#c2 { top: 62.5%; }
#c3 { top: 87.5%; }

.jugador {
  color: #00ff88;
  font-weight: bold;
  margin: 2px 0;
}

#codigoSala {
  font-size: 22px;
  font-weight: bold;
  color: #ffd166;
}

#pregunta { color: #ffe082; }
#timer { color: #7df9ff; }
#ganador { color: #ffd166; }
</style>
</head>

<body>

<div id="menu" class="pantalla activa">
  <h1>🎮 Selecciona juego</h1>
  <button onclick="iniciarModo('camellos')">🐪 Camellos</button>
  <button onclick="iniciarModo('atletismo')">🏃 Atletismo</button>
  <button onclick="iniciarModo('caballos')">🐎 Caballos</button>
</div>

<div id="juego" class="pantalla">

<h1 id="titulo"></h1>

<input id="nombre" placeholder="Nombre">
<select id="grupo">
<option value="0">Grupo 1</option>
<option value="1">Grupo 2</option>
<option value="2">Grupo 3</option>
<option value="3">Grupo 4</option>
</select>

<br>

<button id="btnCrear" onclick="crearSala()">Crear sala</button>
<div id="codigoSala"></div>

<hr>

<input id="codigo" placeholder="Código">
<button onclick="unirse()">Unirse</button>

<h3 id="mensajeUnion"></h3>
<div id="jugadores"></div>

<br>

<button onclick="empezarCarrera()">🚀 Empezar carrera</button>

<h2 id="pregunta"></h2>
<h3 id="timer"></h3>
<h3 id="resultado"></h3>

<input id="respuesta">
<button onclick="responder()">Responder</button>

<h2 id="ganador"></h2>

<div id="pista">
<div class="meta"></div>
<div id="c0" class="personaje"></div>
<div id="c1" class="personaje"></div>
<div id="c2" class="personaje"></div>
<div id="c3" class="personaje"></div>
</div>

<h2>🏆 Ranking global</h2>
<div id="ranking"></div>

<button onclick="resetRanking()">🗑️ Reset ranking</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAgA1B1liq0K6pHn1HqpQ8hXZbxVgqrEt4",
  authDomain: "camellos-dcf0d.firebaseapp.com",
  databaseURL: "https://camellos-dcf0d-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "camellos-dcf0d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let modo="camellos", sala=null, grupo=null;
let META=20, tiempo=40, intervalo=null, respondido=false, preguntaActual=null;

function iniciarModo(m){
  modo=m;
  document.getElementById("menu").classList.remove("activa");
  document.getElementById("juego").classList.add("activa");

  let icono="🐫➡️", fondo="#222";
  if(m==="atletismo"){ icono="🏃‍♂️➡️"; fondo="#8B4513";}
  if(m==="caballos"){ icono="🐎➡️"; fondo="#3a3a3a";}

  document.getElementById("titulo").innerText="Carrera de "+m;

  for(let i=0;i<4;i++){
    document.getElementById("c"+i).innerText=icono;
  }

  document.getElementById("pista").style.background=fondo;
}

function nuevaPregunta(){
  let g=Math.floor(Math.random()*361);
  let m=Math.floor(Math.random()*60);

  if(Math.random()>0.5){
    return {texto:`${g}° ${m}' → minutos`,respuesta:g*60+m,tipo:"min"};
  } else {
    return {texto:`${g}° ${m}' → grados`,respuesta:g+(m/60),tipo:"deg"};
  }
}

function crearSala(){
  sala=Math.random().toString(36).substring(2,6).toUpperCase();
  grupo=document.getElementById("grupo").value;

  document.getElementById("codigoSala").innerText="Código: "+sala;

  db.ref("salas/"+sala).set({
    jugadores:{},
    posiciones:{0:0,1:0,2:0,3:0},
    empezado:false,
    terminado:false
  });

  escuchar();
}

function unirse(){
  sala=document.getElementById("codigo").value.toUpperCase();
  grupo=document.getElementById("grupo").value;
  let nombre=document.getElementById("nombre").value;

  db.ref("salas/"+sala+"/jugadores/"+nombre).set({grupo});

  document.getElementById("mensajeUnion").innerText=
    nombre+" añadido al Grupo "+(parseInt(grupo)+1);

  escuchar();
}

function escuchar(){
  db.ref("salas/"+sala).on("value",snap=>{
    let d=snap.val(); if(!d)return;

    let html="";
    if(!d.empezado){
      for(let j in d.jugadores){
        html+=`<div class="jugador">${j} (G${parseInt(d.jugadores[j].grupo)+1})</div>`;
      }
    }
    document.getElementById("jugadores").innerHTML=html;

    for(let i=0;i<4;i++){
      let x=(d.posiciones[i]/META)*100;
      document.getElementById("c"+i).style.left=x+"%";
    }

    if(d.empezado && !intervalo){
      nuevaRonda();
    }

    if(d.terminado){
      clearInterval(intervalo);
      document.getElementById("ganador").innerText=
        "🏆 GANA GRUPO "+(parseInt(d.ganador)+1);
    }
  });

  escucharRanking();
}

function empezarCarrera(){
  db.ref("salas/"+sala).update({empezado:true});
}

function nuevaRonda(){
  preguntaActual=nuevaPregunta();
  document.getElementById("pregunta").innerText=preguntaActual.texto;
  iniciarTimer();
}

function iniciarTimer(){
  clearInterval(intervalo);
  tiempo=40;
  respondido=false;
  intervalo=setInterval(()=>{
    document.getElementById("timer").innerText="Tiempo: "+tiempo;
    tiempo--;
    if(tiempo<0){ clearInterval(intervalo); nuevaRonda(); }
  },1000);
}

function responder(){
  let val=document.getElementById("respuesta").value.trim();
  if(val===""||respondido)return;
  respondido=true;

  val=val.replace(",",".");
  let correcto=false;

  if(preguntaActual.tipo==="min"){
    correcto=Number(val)===preguntaActual.respuesta;
  }else{
    correcto=Math.abs(Number(val)-preguntaActual.respuesta)<0.01;
  }

  document.getElementById("resultado").innerText=
    correcto?"✅ Correcto":"❌ Incorrecto";

  db.ref("salas/"+sala).once("value").then(snap=>{
    let d=snap.val();
    let pos=d.posiciones[grupo];

    if(correcto) pos++;
    else { pos--; if(pos<0) pos=0; }

    let updates={};
    updates[`salas/${sala}/posiciones/${grupo}`]=pos;

    if(pos>=META){
      updates[`salas/${sala}/terminado`]=true;
      updates[`salas/${sala}/ganador`]=grupo;
    }

    db.ref().update(updates);
  });

  document.getElementById("respuesta").value="";
  setTimeout(nuevaRonda,500);
}

function escucharRanking(){
  db.ref("ranking").on("value",snap=>{
    let r=snap.val()||{};
    let html="";
    for(let i=0;i<4;i++){
      html+=`Grupo ${i+1}: ${r[i]||0} puntos<br>`;
    }
    document.getElementById("ranking").innerHTML=html;
  });
}

function resetRanking(){
  let clave=prompt("Contraseña:");
  if(clave==="mat") db.ref("ranking").set(null);
}
</script>

</body>
</html>
