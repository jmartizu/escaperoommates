<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>🎮 Juegos de Carrera</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#1a1a1a,#000);
  color:white;
  text-align:center;
}

#pista {
  width:90%;
  height:260px;
  margin:20px auto;
  border:3px solid white;
  position:relative;
  background:#222;
}

.meta {
  position:absolute;
  right:0;
  width:20px;
  height:100%;
  background: repeating-linear-gradient(
    0deg, white 0px, white 10px, black 10px, black 20px
  );
}

.personaje {
  position:absolute;
  font-size:40px;
  transition:0.4s linear;
}

#c0 { top:10%; }
#c1 { top:35%; }
#c2 { top:60%; }
#c3 { top:85%; }

#jugadores {
  margin:15px;
  padding:10px;
  border:2px solid #0f0;
}

.jugador {
  color:lightgreen;
}

</style>
</head>

<body>

<h1 id="titulo">🎮 Carrera</h1>

<input id="nombre" placeholder="Nombre">
<select id="grupo">
<option value="0">Grupo 1</option>
<option value="1">Grupo 2</option>
<option value="2">Grupo 3</option>
<option value="3">Grupo 4</option>
</select>

<br>

<button onclick="crearSala()">Crear sala</button>
<div id="codigoSala"></div>

<hr>

<input id="codigo" placeholder="Código">
<button onclick="unirse()">Unirse</button>

<h3 id="mensajeUnion"></h3>

<div id="jugadores"></div>

<br>

<button onclick="empezar()">🚀 Empezar carrera</button>

<h2 id="pregunta"></h2>
<h3 id="timer"></h3>
<h3 id="resultado"></h3>

<input id="respuesta">
<button onclick="responder()">Responder</button>

<h2 id="ganador"></h2>

<div id="pista">
<div class="meta"></div>
<div id="c0" class="personaje">🐫</div>
<div id="c1" class="personaje">🐫</div>
<div id="c2" class="personaje">🐫</div>
<div id="c3" class="personaje">🐫</div>
</div>

<h2>🏆 Ranking</h2>
<div id="ranking"></div>

<button onclick="resetRanking()">Reset</button>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyAgA1B1liq0K6pHn1HqpQ8hXZbxVgqrEt4",
authDomain: "camellos-dcf0d.firebaseapp.com",
databaseURL: "https://camellos-dcf0d-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "camellos-dcf0d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let sala=null, grupo=null;

// crear sala
function crearSala(){
sala=Math.random().toString(36).substring(2,6).toUpperCase();
grupo=document.getElementById("grupo").value;

document.getElementById("codigoSala").innerText=sala;

db.ref("salas/"+sala).set({
jugadores:{},
posiciones:{0:0,1:0,2:0,3:0},
empezado:false
});

escuchar();
}

// unirse
function unirse(){
sala=document.getElementById("codigo").value.toUpperCase();
grupo=document.getElementById("grupo").value;
let nombre=document.getElementById("nombre").value;

db.ref("salas/"+sala+"/jugadores/"+nombre).set({
grupo:grupo
});

document.getElementById("mensajeUnion").innerText =
nombre+" unido al grupo "+(parseInt(grupo)+1);

escuchar();
}

// escuchar
function escuchar(){
db.ref("salas/"+sala).on("value",snap=>{
let d=snap.val(); if(!d)return;

// jugadores en verde
let html="<b>Jugadores:</b><br>";
for(let j in d.jugadores){
html += "<div class='jugador'>"+j+" (Grupo "+(parseInt(d.jugadores[j].grupo)+1)+")</div>";
}
document.getElementById("jugadores").innerHTML=html;

// ocultar al empezar
if(d.empezado){
document.getElementById("jugadores").innerHTML="";
}
});
}

// empezar
function empezar(){
db.ref("salas/"+sala).update({empezado:true});
}

// reset ranking
function resetRanking(){
let clave=prompt("Contraseña:");
if(clave==="mat"){
db.ref("ranking").set(null);
}
}
</script>

</body>
</html>
